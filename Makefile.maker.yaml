# Configuration file for <https://github.com/sapcc/go-makefile-maker>

metadata:
  url: https://github.com/SAP-cloud-infrastructure/maia

binaries:
  - name:        maia
    fromPackage: .
    installTo:   bin/

golang:
  setGoModVersion: true
  autoupdateDependencies:
    enabled: true
    matchModule: ^github.com/(?:sapcc|sap-cloud-infrastructure)/

dockerfile:
  enabled: yes
  # The React UI (web/ui/) is built during `make generate` via pnpm/build_ui.sh,
  # which `make install` depends on. The builder image therefore needs a JS
  # toolchain so `//go:embed static` finds the compiled assets at compile time.
  # bash is required because build_ui.sh and the vendored Prometheus module
  # build scripts use bash-isms (Alpine ships busybox ash by default).
  extraBuildPackages:
    - nodejs
    - npm
    - bash

golangciLint:
  createConfig: true
  # errors.AsType[T] (Go 1.27) returns (T, bool); the modernize linter rewrites
  # the classic errors.As two-step into it, but errcheck does not yet understand
  # the generic signature and incorrectly reports the discarded first return as an
  # unchecked error. Exclude it until errcheck catches up with Go 1.27.
  errcheckExcludes:
    - errors.AsType

githubWorkflow:
  ci:
    enabled: true
    prepareMakeTarget: generate

nix:
  extraPackages:
    - mockgen
    - nodejs
    - pnpm

typos:
  enabled: true
  extendExcludes:
    - "web/static/vendor/"
    - "web/ui/node_modules/"
    - "web/ui/module/"
    - "web/ui/mantine-ui/src/pages/targets/"
    - "web/ui/mantine-ui/src/pages/service-discovery/"
    - "docs/*.svg"
  extendWords:
    ba: ba
    Alue: Alue
    valu: valu
    tabl: tabl
    pn: pn
    ignor: ignor

renovate:
  enabled: true
  assignees:
    - notque
  # Watch the pinned upstream version in web/ui/UPSTREAM.md so Renovate opens a
  # PR when Prometheus (whose mantine-ui we hard-fork under web/ui/) cuts a new
  # release. The fork is copied source, not a tracked dependency, so nothing
  # else surfaces upstream drift. This only NOTIFIES — the actual re-sync is the
  # tooling-assisted manual process in web/ui/UPSTREAM.md (see sync-mantine-ui.sh).
  customManagers:
    - customType: regex
      managerFilePatterns:
        - '/^web/ui/UPSTREAM\.md$/'
      matchStrings:
        - 'UPSTREAM_VERSION=(?<currentValue>v\d+\.\d+\.\d+)'
      depNameTemplate: prometheus/prometheus
      datasourceTemplate: github-releases

reuse:
  annotations:
    - paths:
      - mise.toml
      - web/ui/.gitignore
      - web/ui/.npmrc
      - web/ui/.nvmrc
      - web/ui/embed.go.tmpl
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
    # Upstream Prometheus mantine-ui — forked from
    # https://github.com/prometheus/prometheus at v3.11.2. Copyright is held by
    # The Prometheus Authors (not asserted by SAP), Apache-2.0.
    - paths:
      - web/ui/README.md
      - web/ui/build_ui.sh
      - web/ui/package.json
      - web/ui/pnpm-lock.yaml
      - web/ui/pnpm-workspace.yaml
      - web/ui/mantine-ui/**
      - web/ui/module/**
      SPDX-FileCopyrightText: The Prometheus Authors
      SPDX-License-Identifier: Apache-2.0
    # Maia-specific UI files authored by SAP — override the upstream annotation.
    - paths:
      - web/ui/mantine-ui/src/lib/maiaFetch.ts
      - web/ui/mantine-ui/src/context/MaiaProjectContext.tsx
      - web/ui/mantine-ui/src/components/MaiaProjectSwitcher.tsx
      precedence: override
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
    - paths:
      - CLAUDE.md
      - build/*.txt
      - build/*.out
      - etc/*.conf
      - etc/*.json
      - pkg/*/fixtures/*.json
      - pkg/*/fixtures/*.txt
      - pkg/test/*.json
      - docs/*.png
      - docs/*.svg
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
verbatim: |
  build/maia: generate
  static-check: generate-mocks

  build/maia: GO_BUILDFLAGS += -tags builtinassets

  generate-mocks: FORCE
    if ! hash mockgen 2>/dev/null; then go install go.uber.org/mock/mockgen@v0.6.0; fi
    mockgen --source=pkg/storage/interface.go --destination=pkg/storage/genmock.go --package=storage
    mockgen --source=pkg/keystone/interface.go --destination=pkg/keystone/genmock.go --package=keystone

  generate: generate-mocks FORCE
    if ! hash addlicense 2>/dev/null; then go install github.com/google/addlicense@v1.2.0; fi
    # New React UI: build the mantine-ui bundle into web/ui/static/ for go:embed.
    cd web/ui && bash build_ui.sh
    addlicense -c "SAP SE or an SAP affiliate company" ./web/ui/assets_embed.go ./web/ui/ui.go

  # check-ui-cves: scan the vendored mantine-ui fork's JS dependency tree for
  # known vulnerabilities. The fork (web/ui/, see web/ui/UPSTREAM.md) is copied
  # source, not a Renovate-tracked dependency, so its npm deps are invisible to
  # the repo's Go-only osvVulnerabilityAlerts. This is the local equivalent of
  # the weekly .github/workflows/osv-scan.yaml. Installs osv-scanner on demand.
  check-ui-cves: FORCE
    if ! hash osv-scanner 2>/dev/null; then go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest; fi
    osv-scanner scan --lockfile=web/ui/pnpm-lock.yaml
