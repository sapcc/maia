#
# NOT generated by go-makefile-maker. go-makefile-maker has no schema for this
# workflow, so it will neither create nor clobber this file — it is maintained
# by hand. (Do not add the "AUTOGENERATED / DO NOT EDIT" banner here.)
#
# Why this exists:
#   web/ui/ is a HARD FORK of Prometheus mantine-ui (copied source, see
#   web/ui/UPSTREAM.md). Its JavaScript dependency tree lives in
#   web/ui/pnpm-lock.yaml, which is NOT a Renovate-tracked dependency and is NOT
#   covered by the repo's Go-only osvVulnerabilityAlerts. Without this scan, a
#   critical CVE in the vendored fork's npm deps would go unnoticed until the
#   next manual re-sync.
#
# Behaviour (matches the agreed policy — see task_plan.md / web/ui/UPSTREAM.md):
#   * Weekly, on the same Monday-07:00 cron as codeql.yaml.
#   * NOTIFY-ONLY / NON-BLOCKING: fail-on-vuln is false, so a found CVE never
#     turns this run red and never gates an unrelated PR. The signal is a
#     Security > Code scanning alert (SARIF upload), prioritisable by severity.
#   * Manually runnable via workflow_dispatch when a re-sync just landed.

name: OSV Scan (vendored UI deps)
"on":
  schedule:
    # Mondays at 07:05 UTC — five minutes after codeql so the two scheduled
    # security scans don't contend for the same runner start slot.
    - cron: '05 07 * * 1'
  workflow_dispatch: {}
  # Also run when the fork's dependency surface actually changes, so a re-sync
  # PR gets a fresh scan without waiting for the weekly cron. Still non-blocking.
  pull_request:
    branches:
      - master
    paths:
      - 'web/ui/pnpm-lock.yaml'
      - 'web/ui/package.json'
      - '.github/workflows/osv-scan.yaml'

permissions:
  # Required by the reusable workflow to upload SARIF to the Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  scan-vendored-ui:
    # Pinned to v2.5.0 by full commit SHA, consistent with the repo's other
    # workflows. Bump the SHA and the trailing version comment together.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Scope the scan to the vendored fork's JS lockfile only. The Go module
      # tree is already covered by Renovate's osvVulnerabilityAlerts, so a bare
      # recursive scan would just duplicate that signal.
      scan-args: |-
        --lockfile=web/ui/pnpm-lock.yaml
      # Non-blocking: surface findings in the Security tab, never fail the run.
      fail-on-vuln: false
      upload-sarif: true
